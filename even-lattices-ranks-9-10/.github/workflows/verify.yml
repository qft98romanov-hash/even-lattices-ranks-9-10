name: Verify exact certificates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check file identity and run the routine exact verification suite
        run: python scripts/verify.py
